[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "castle-challenges"
version = "0.1.0"
description = "Research tools for two castle allocation games"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
castle-challenges = "castle_challenges.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
