[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "castle-challenges"
version = "0.2.0"
description = "Separate research scaffolds for two castle allocation games"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
castle-head-to-head = "castle_challenges.games.head_to_head.cli:main"
castle-four-way = "castle_challenges.games.four_way.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
castle_challenges = ["games/head_to_head/fast_dp.cpp"]
